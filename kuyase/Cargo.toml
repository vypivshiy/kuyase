[package]
name = "kuyase"
version = "1.1.0"
edition = "2021"
description = "KUYASE Native Smart Speaker Emulator, ADB Client, and Verification Suite"

[dependencies]
protocol = { path = "../protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.1"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
eframe = "0.30"
